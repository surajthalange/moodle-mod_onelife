name: Moodle Plugin CI

# One run per meaningful change, not two.
#
# "on: [push, pull_request]" fired twice for the same commit whenever a branch with an
# open pull request was pushed: once for the push and once for the pull request. With a
# sixteen entry matrix that is thirty two jobs to learn one thing.
#
# Pushes are now watched only on main, so work on a feature branch is validated once,
# through its pull request. workflow_dispatch covers the case of wanting a run on a
# branch that has no pull request open yet.
#
# Tags deliberately do not trigger a run. A release tag points at a commit that has
# already passed on main, and the tree is identical, so re-running the matrix on the
# tag tests nothing new.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      # PHP versions are the minimum and maximum each Moodle branch is itself tested
      # against, taken from that branch's own .github/workflows/push.yml and
      # cross-checked against its composer.json "php" constraint. They are not guesses,
      # and they are not a single value carried across branches:
      #
      #   MOODLE_405_STABLE  PHP 8.1 - 8.3   PHPUnit ^9.6.34
      #   MOODLE_500_STABLE  PHP 8.2 - 8.4   PHPUnit ^11
      #   MOODLE_501_STABLE  PHP 8.2 - 8.4   PHPUnit ^11
      #   MOODLE_502_STABLE  PHP 8.3 - 8.4   PHPUnit ^11
      #   MOODLE_503_STABLE  PHP 8.3 - 8.4   PHPUnit ^11
      #
      # 4.5 LTS is the PRD's supported floor and the only branch still on PHPUnit 9.6,
      # which predates the attributes API. That is precisely the gap this workflow
      # exists to cover, so it must never be dropped to make the matrix green.
      #
      # Both databases are tested rather than one. The plugin ships XMLDB schema and
      # deletes across three tables, and install and cascade behaviour is exactly where
      # engine differences bite; a single database would not exercise that.
      matrix:
        include:
          - {moodle-branch: MOODLE_405_STABLE, php: '8.1', database: pgsql}
          - {moodle-branch: MOODLE_405_STABLE, php: '8.1', database: mariadb}
          - {moodle-branch: MOODLE_405_STABLE, php: '8.3', database: pgsql}
          - {moodle-branch: MOODLE_405_STABLE, php: '8.3', database: mariadb}
          - {moodle-branch: MOODLE_500_STABLE, php: '8.2', database: pgsql}
          - {moodle-branch: MOODLE_500_STABLE, php: '8.2', database: mariadb}
          - {moodle-branch: MOODLE_500_STABLE, php: '8.4', database: pgsql}
          - {moodle-branch: MOODLE_500_STABLE, php: '8.4', database: mariadb}
          - {moodle-branch: MOODLE_501_STABLE, php: '8.2', database: pgsql}
          - {moodle-branch: MOODLE_501_STABLE, php: '8.2', database: mariadb}
          - {moodle-branch: MOODLE_501_STABLE, php: '8.4', database: pgsql}
          - {moodle-branch: MOODLE_501_STABLE, php: '8.4', database: mariadb}
          - {moodle-branch: MOODLE_502_STABLE, php: '8.3', database: pgsql}
          - {moodle-branch: MOODLE_502_STABLE, php: '8.3', database: mariadb}
          - {moodle-branch: MOODLE_502_STABLE, php: '8.4', database: pgsql}
          - {moodle-branch: MOODLE_502_STABLE, php: '8.4', database: mariadb}
          - {moodle-branch: MOODLE_503_STABLE, php: '8.3', database: pgsql}
          - {moodle-branch: MOODLE_503_STABLE, php: '8.3', database: mariadb}
          - {moodle-branch: MOODLE_503_STABLE, php: '8.4', database: pgsql}
          - {moodle-branch: MOODLE_503_STABLE, php: '8.4', database: mariadb}

    steps:
      # The databases run from steps rather than as service containers, because a service
      # container's credentials cannot be made conditional and a fork needs different
      # behaviour from us.
      #
      # Docker Hub's anonymous pull limit is about a hundred per six hours counted per
      # client address, and GitHub's runner addresses are shared, so this matrix can be
      # rate limited by builds that have nothing to do with this repository; that has
      # already cost one round of red jobs that read exactly like code failures. AWS's
      # mirror of the same images is worse for this workload: its anonymous limit is on
      # data transferred, and three plugin matrices pushed together exceeded it within
      # seconds.
      #
      # So we authenticate. But repository secrets arrive as EMPTY STRINGS on a pull
      # request from a fork rather than being absent, and a blank login fails the pull and
      # takes the whole job with it rather than falling back to an anonymous one — that is
      # measured, not assumed. Hence the fork check: our runs authenticate, a fork's runs
      # pull anonymously and still work.
      - name: Log in to Docker Hub
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v3
        with:
          username: surajthalange
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Started before the checkout and the PHP setup so that the database boots while
      # composer works, and waited for further down, just before it is first needed.
      - name: Start PostgreSQL
        if: matrix.database == 'pgsql'
        run: >
          docker run -d --name moodle-db -p 5432:5432
          -e POSTGRES_USER=postgres
          -e POSTGRES_HOST_AUTH_METHOD=trust
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
          postgres:17

      - name: Start MariaDB
        if: matrix.database == 'mariadb'
        run: >
          docker run -d --name moodle-db -p 3306:3306
          -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1
          -e MYSQL_CHARACTER_SET_SERVER=utf8mb4
          -e MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
          mariadb:11

      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          # Keep "none" while there is no coverage reporting. With "none" PHPUnit falls
          # back to phpdbg only if coverage is actually requested, which it is not.
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' moodle-db 2>/dev/null)" = healthy ]; then
              echo "Database healthy after $i checks."
              exit 0
            fi
            sleep 3
          done
          echo "Database did not become healthy within three minutes."
          docker logs moodle-db || true
          exit 1

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # Advisory only: reports findings without failing the build.
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # Behat, added at build step 10 now that tests/behat/onelife.feature exists.
      # --profile chrome matches the upstream gha.dist.yml: moodle-plugin-ci starts
      # ChromeDriver and talks to it directly over W3C WebDriver, with no Selenium.
      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      # A failed acceptance run is close to unreadable without the page dumps, because
      # the browser is gone by the time the log is read.
      - name: Upload Behat faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump-${{ matrix.moodle-branch }}-php${{ matrix.php }}-${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
